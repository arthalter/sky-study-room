<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约管理端</title>
  <link rel="stylesheet" href="./styles.css?v=20260522-fix3">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>Admin Console</h1>
          <p>资源与审核管理</p>
        </div>
      </div>
      <nav class="nav" id="nav" hidden>
        <button class="nav-item active" data-view="reservations">预约审核</button>
        <button class="nav-item" data-view="resources">资源管理</button>
      </nav>
      <div class="side-footer" id="adminBox" hidden>
        <span id="currentAdmin"></span>
        <button class="ghost" id="logoutBtn">退出</button>
      </div>
    </aside>

    <main class="main">
      <section class="login-panel" id="loginView">
        <div>
          <p class="eyebrow">Sky Study Room</p>
          <h2>管理员登录</h2>
          <p>审核预约、维护资源状态，审核结果会通过消息队列生成用户通知。</p>
        </div>
        <form class="form-card" id="loginForm">
          <label>
            账号
            <input name="name" value="admin" autocomplete="username" required>
          </label>
          <label>
            密码
            <input name="password" type="password" value="123456" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">登录</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </section>

      <section class="view active" id="reservationsView" hidden>
        <div class="page-head">
          <div>
            <p class="eyebrow">Review</p>
            <h2>预约审核</h2>
          </div>
          <button class="secondary" id="refreshReservationsBtn">刷新</button>
        </div>
        <form class="toolbar compact" id="reservationFilterForm">
          <label>
            状态
            <select name="status">
              <option value="">全部</option>
              <option value="1">待审核</option>
              <option value="2">已通过</option>
              <option value="3">已拒绝</option>
              <option value="4">已取消</option>
            </select>
          </label>
          <button class="primary" type="submit">筛选</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>用户</th>
                <th>资源</th>
                <th>日期</th>
                <th>时间</th>
                <th>用途</th>
                <th>状态</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reservationRows"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="resourcesView" hidden>
        <div class="page-head">
          <div>
            <p class="eyebrow">Resources</p>
            <h2>资源管理</h2>
          </div>
          <button class="primary" id="newResourceBtn">新增资源</button>
        </div>
        <form class="toolbar" id="resourceFilterForm">
          <label>
            名称
            <input name="resourceName" placeholder="按名称搜索">
          </label>
          <label>
            类型
            <select name="resourceType">
              <option value="">全部</option>
              <option value="PUBLIC_SEAT">公共自习位</option>
              <option value="PRIVATE_ROOM">独立自习室</option>
              <option value="MEETING_ROOM">讨论室</option>
            </select>
          </label>
          <label>
            状态
            <select name="status">
              <option value="">全部</option>
              <option value="1">可用</option>
              <option value="0">停用</option>
              <option value="2">维修中</option>
            </select>
          </label>
          <button class="primary" type="submit">查询</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>编号</th>
                <th>名称</th>
                <th>类型</th>
                <th>楼层</th>
                <th>开放时间</th>
                <th>状态</th>
                <th>描述</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="resourceRows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="reviewDialog">
    <form method="dialog" class="form-card" id="reviewForm">
      <div class="dialog-head">
        <h3>处理预约</h3>
        <button class="icon-btn" type="button" data-close="reviewDialog">×</button>
      </div>
      <input type="hidden" name="reservationId">
      <label>
        处理结果
        <select name="status" required>
          <option value="2">通过</option>
          <option value="3">拒绝</option>
        </select>
      </label>
      <label>
        审核备注
        <textarea name="reviewRemark" rows="4" placeholder="给用户看的审核说明"></textarea>
      </label>
      <div class="dialog-actions">
        <button class="secondary" type="button" data-close="reviewDialog">取消</button>
        <button class="primary" type="submit">提交</button>
      </div>
      <p class="form-message" id="reviewMessage"></p>
    </form>
  </dialog>

  <dialog id="resourceDialog">
    <form method="dialog" class="form-card" id="resourceForm">
      <div class="dialog-head">
        <h3 id="resourceDialogTitle">新增资源</h3>
        <button class="icon-btn" type="button" data-close="resourceDialog">×</button>
      </div>
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>
          编号
          <input name="resourceCode" placeholder="A-101" required>
        </label>
        <label>
          名称
          <input name="resourceName" placeholder="Window Seat" required>
        </label>
        <label>
          类型
          <select name="resourceType" required>
            <option value="PUBLIC_SEAT">公共自习位</option>
            <option value="PRIVATE_ROOM">独立自习室</option>
            <option value="MEETING_ROOM">讨论室</option>
          </select>
        </label>
        <label>
          楼层
          <input name="floor" placeholder="1F" required>
        </label>
      </div>
      <label>
        开放时间
        <input name="openTime" placeholder="08:00-22:00" required>
      </label>
      <label>
        描述
        <textarea name="description" rows="3"></textarea>
      </label>
      <div class="dialog-actions">
        <button class="secondary" type="button" data-close="resourceDialog">取消</button>
        <button class="primary" type="submit">保存</button>
      </div>
      <p class="form-message" id="resourceMessage"></p>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="./app.js?v=20260522-fix3"></script>
</body>
</html>
