<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约用户端</title>
  <link rel="stylesheet" href="./styles.css?v=20260522-fix3">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <h1>Study Room</h1>
          <p>用户预约台</p>
        </div>
      </div>
      <nav class="nav" id="nav" hidden>
        <button class="nav-item active" data-view="booking">预约</button>
        <button class="nav-item" data-view="reservations">我的预约</button>
        <button class="nav-item" data-view="notifications">通知</button>
      </nav>
      <div class="side-footer" id="userBox" hidden>
        <span id="currentUser"></span>
        <button class="ghost" id="logoutBtn">退出</button>
      </div>
    </aside>

    <main class="main">
      <section class="login-panel" id="loginView">
        <div class="login-copy">
          <p class="eyebrow">Sky Study Room</p>
          <h2>用户登录</h2>
          <p>登录后可以筛选资源、提交预约，并查看审核通知。</p>
        </div>
        <form class="login-form" id="loginForm">
          <label>
            账号
            <input name="name" value="student" autocomplete="username" required>
          </label>
          <label>
            密码
            <input name="password" type="password" value="123456" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">登录</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </section>

      <section class="view active" id="bookingView" hidden>
        <div class="page-head">
          <div>
            <p class="eyebrow">Booking</p>
            <h2>选择可预约资源</h2>
          </div>
          <button class="secondary" id="refreshResourcesBtn">刷新</button>
        </div>

        <div class="metrics" id="categoryMetrics"></div>

        <form class="toolbar" id="resourceFilterForm">
          <label>
            资源类型
            <select name="resourceType">
              <option value="">全部</option>
              <option value="PUBLIC_SEAT">公共自习位</option>
              <option value="PRIVATE_ROOM">独立自习室</option>
              <option value="MEETING_ROOM">讨论室</option>
            </select>
          </label>
          <label>
            日期
            <input name="reserveDate" type="date" required>
          </label>
          <label>
            开始
            <input name="startTime" type="time" value="09:00" required>
          </label>
          <label>
            结束
            <input name="endTime" type="time" value="10:00" required>
          </label>
          <button class="primary" type="submit">查询</button>
        </form>

        <div class="resource-grid" id="resourceGrid"></div>
      </section>

      <section class="view" id="reservationsView" hidden>
        <div class="page-head">
          <div>
            <p class="eyebrow">History</p>
            <h2>我的预约</h2>
          </div>
          <button class="secondary" id="refreshReservationsBtn">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>资源</th>
                <th>日期</th>
                <th>时间</th>
                <th>用途</th>
                <th>状态</th>
                <th>备注</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="reservationRows"></tbody>
          </table>
        </div>
      </section>

      <section class="view" id="notificationsView" hidden>
        <div class="page-head">
          <div>
            <p class="eyebrow">Messages</p>
            <h2>站内通知</h2>
          </div>
          <button class="secondary" id="refreshNotificationsBtn">刷新</button>
        </div>
        <div class="notice-list" id="notificationList"></div>
      </section>
    </main>
  </div>

  <dialog id="bookingDialog">
    <form method="dialog" class="dialog-form" id="bookingForm">
      <div class="dialog-head">
        <h3>提交预约</h3>
        <button class="icon-btn" type="button" id="closeBookingDialog">×</button>
      </div>
      <input type="hidden" name="resourceId">
      <label>
        资源
        <input name="resourceName" readonly>
      </label>
      <label>
        用途
        <textarea name="purpose" rows="4" placeholder="例如：自习、复习、面试准备" required></textarea>
      </label>
      <div class="dialog-actions">
        <button class="secondary" type="button" id="cancelBookingDialog">取消</button>
        <button class="primary" type="submit">提交</button>
      </div>
      <p class="form-message" id="bookingMessage"></p>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="./app.js?v=20260522-fix3"></script>
</body>
</html>
