server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: sky-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sky_study?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.study.entity
  configuration:
    map-underscore-to-camel-case: true

sky:
  jwt:
    secret-key: ${JWT_SECRET:sky-study-room-dev-secret-key-2026}
    ttl: 7200000
    token-name: token
springdoc:
  api-docs:
    enabled: true

